create_stereo_pair:
  name: Create stereo pair
  description: Bond two matching speakers into a stereo pair (the local API allows mixed models the Sonos app refuses).
  fields:
    left:
      name: Left speaker
      description: Sonos room/speaker name for the left channel.
      required: true
      example: Bedroom
      selector:
        text:
    right:
      name: Right speaker
      description: Sonos room/speaker name for the right channel.
      required: true
      example: Bedroom 2
      selector:
        text:

separate:
  name: Separate stereo pair
  description: Split a stereo pair back into two standalone speakers.
  fields:
    left:
      name: Left speaker
      required: true
      selector:
        text:
    right:
      name: Right speaker
      required: true
      selector:
        text:

set_home_theater:
  name: Set up home theater
  description: Bond surrounds and a sub to a soundbar. Each channel is added one at a time (poll + retry), and the layout is snapshotted first.
  fields:
    soundbar:
      name: Soundbar
      description: The Arc/Beam/Ray to build the home theater around.
      required: true
      example: Media Room
      selector:
        text:
    lf:
      name: Front left
      selector:
        text:
    rf:
      name: Front right
      selector:
        text:
    lr:
      name: Rear left
      selector:
        text:
    rr:
      name: Rear right
      selector:
        text:
    sw:
      name: Sub
      selector:
        text:

remove_home_theater:
  name: Remove home theater
  description: Remove one satellite, or (with no satellite given) dissolve the whole home theater back to standalone speakers.
  fields:
    soundbar:
      name: Soundbar
      required: true
      selector:
        text:
    satellite:
      name: Satellite (optional)
      description: A single speaker to remove. Leave blank to dissolve the entire home theater.
      selector:
        text:

move:
  name: Move to another room
  description: Rename a speaker's Sonos zone (SetZoneAttributes) — how you move a speaker between rooms.
  fields:
    speaker:
      name: Speaker
      required: true
      selector:
        text:
    name:
      name: New room name
      required: true
      selector:
        text:

snapshot:
  name: Snapshot home theater
  description: Save a soundbar's current home-theater layout so it can be restored later.
  fields:
    soundbar:
      name: Soundbar
      required: true
      selector:
        text:

restore:
  name: Restore home theater
  description: Re-apply the last snapshotted home-theater layout for a soundbar.
  fields:
    soundbar:
      name: Soundbar
      required: true
      selector:
        text:
