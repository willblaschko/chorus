create_stereo_pair:
  name: Create stereo pair
  description: Bond two matching speakers into a stereo pair (the local API allows mixed models the Sonos app refuses).
  fields:
    left:
      name: Left speaker
      description: Sonos room/speaker name for the left channel.
      required: true
      example: Living Room
      selector:
        text:
    right:
      name: Right speaker
      description: Sonos room/speaker name for the right channel.
      required: true
      example: Living Room (right)
      selector:
        text:

separate:
  name: Separate stereo pair
  description: Split a stereo pair back into two standalone speakers.
  fields:
    left:
      name: Left speaker
      required: true
      selector:
        text:
    right:
      name: Right speaker
      required: true
      selector:
        text:

add_pair_sub:
  name: Add a sub to a set
  description: Bond a sub to a stereo pair OR a lone speaker (re-issues CreateStereoPair with the sub appended to the channel map). Omit "right" for a lone speaker + sub.
  fields:
    left:
      name: Primary speaker
      description: The set's visible primary — a pair's left speaker, or a lone speaker (name or UID).
      required: true
      selector:
        text:
    right:
      name: Pair right speaker (pairs only)
      description: The pair's right speaker (UID). Omit for a lone speaker + sub.
      selector:
        text:
    sub:
      name: Sub
      description: The sub to bond (UID).
      required: true
      selector:
        text:

remove_pair_sub:
  name: Remove a sub from a set
  description: Unbond a sub from a stereo pair or a lone speaker (separates the set; for a pair, re-pairs the two speakers). Omit "right" for a lone speaker.
  fields:
    left:
      name: Primary speaker
      required: true
      selector:
        text:
    right:
      name: Pair right speaker (pairs only)
      selector:
        text:
    sub:
      name: Sub
      required: true
      selector:
        text:

set_home_theater:
  name: Set up home theater
  description: Bond surrounds and a sub to a soundbar. Each channel is added one at a time (poll + retry), and the layout is snapshotted first.
  fields:
    soundbar:
      name: Soundbar
      description: The Arc/Beam/Ray to build the home theater around.
      required: true
      example: Living Room
      selector:
        text:
    lf:
      name: Front left
      selector:
        text:
    rf:
      name: Front right
      selector:
        text:
    lr:
      name: Rear left
      selector:
        text:
    rr:
      name: Rear right
      selector:
        text:
    sw:
      name: Sub
      selector:
        text:

remove_home_theater:
  name: Remove home theater
  description: Remove one satellite by channel (bonded satellites are invisible, so address them by channel), or dissolve the whole home theater when nothing is specified.
  fields:
    soundbar:
      name: Soundbar
      required: true
      selector:
        text:
    channel:
      name: Channel (optional)
      description: Which satellite to remove — LF, RF, LR, RR or SW. Leave blank to dissolve the entire home theater.
      example: SW
      selector:
        select:
          options: [LF, RF, LR, RR, SW]
    satellite:
      name: Satellite name (optional)
      description: A still-standalone speaker to remove, by name. For already-bonded satellites use Channel instead.
      selector:
        text:

move:
  name: Move to another room
  description: Rename a speaker's Sonos zone (SetZoneAttributes) — how you move a speaker between rooms.
  fields:
    speaker:
      name: Speaker
      required: true
      selector:
        text:
    name:
      name: New zone name
      required: true
      selector:
        text:
    area:
      name: HA Area
      description: HA Area to group under. Defaults to the zone name; differs only when the room already holds another zone (e.g. zone "Den 2" in area "Den").
      required: false
      selector:
        text:
    icon:
      name: Room icon
      description: Optional Sonos room-icon token (a lowercase room name like "office" or "living_room").
      required: false
      selector:
        text:

rename:
  name: Rename speaker
  description: Rename a speaker's Sonos zone (SetZoneAttributes) without changing its room.
  fields:
    speaker:
      name: Speaker
      description: Sonos room/speaker name or RINCON UID.
      required: true
      selector:
        text:
    name:
      name: New name
      required: true
      selector:
        text:
    icon:
      name: Room icon
      description: Optional Sonos room-icon token (a lowercase room name like "office" or "living_room").
      required: false
      selector:
        text:

set_fixed_output:
  name: Fixed line-out volume
  description: Toggle a speaker's fixed line-out level (RenderingControl SetOutputFixed) — for a Connect/Port/Amp/Five feeding an external amplifier.
  fields:
    speaker:
      name: Speaker
      description: Sonos room/speaker name or RINCON UID.
      required: true
      selector:
        text:
    enabled:
      name: Fixed output
      description: On = fixed line-out level (control volume on the amp); Off = Sonos controls the level.
      required: true
      selector:
        boolean:

snapshot:
  name: Snapshot home theater
  description: Save a soundbar's current home-theater layout so it can be restored later.
  fields:
    soundbar:
      name: Soundbar
      required: true
      selector:
        text:

restore:
  name: Restore home theater
  description: Re-apply the last snapshotted home-theater layout for a soundbar.
  fields:
    soundbar:
      name: Soundbar
      required: true
      selector:
        text:
