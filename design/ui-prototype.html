<title>Chorus — a Sonos speaker manager for Home Assistant</title>
<style>
  :root{
    --bg:#f2f2f7;--card:#fff;--tile:#e9e9ee;--hair:rgba(60,60,67,.2);--hair-2:rgba(60,60,67,.32);
    --text:#1d1d1f;--text-2:rgba(60,60,67,.74);--text-3:rgba(60,60,67,.55);
    --accent:#007aff;--danger:#ff3b30;
    --c-front:#007aff;--c-rear:#30b0c7;--c-sub:#5856d6;--c-bar:#007aff;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 26px -18px rgba(0,0,0,.22);
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#000;--card:#1c1c1e;--tile:#2c2c2e;--hair:rgba(235,235,245,.16);--hair-2:rgba(235,235,245,.26);
    --text:#f5f5f7;--text-2:rgba(235,235,245,.74);--text-3:rgba(235,235,245,.58);
    --accent:#0a84ff;--danger:#ff453a;
    --c-front:#0a84ff;--c-rear:#40cbe0;--c-sub:#7d7aff;--c-bar:#0a84ff;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.7);
  }}
  :root[data-theme="light"]{--bg:#f2f2f7;--card:#fff;--tile:#e9e9ee;--hair:rgba(60,60,67,.2);--hair-2:rgba(60,60,67,.32);--text:#1d1d1f;--text-2:rgba(60,60,67,.74);--text-3:rgba(60,60,67,.55);--accent:#007aff;--danger:#ff3b30;--c-front:#007aff;--c-rear:#30b0c7;--c-sub:#5856d6;--c-bar:#007aff;--shadow:0 1px 2px rgba(0,0,0,.05),0 10px 26px -18px rgba(0,0,0,.22);}
  :root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tile:#2c2c2e;--hair:rgba(235,235,245,.16);--hair-2:rgba(235,235,245,.26);--text:#f5f5f7;--text-2:rgba(235,235,245,.74);--text-3:rgba(235,235,245,.58);--accent:#0a84ff;--danger:#ff453a;--c-front:#0a84ff;--c-rear:#40cbe0;--c-sub:#7d7aff;--c-bar:#0a84ff;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.7);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);letter-spacing:-.014em;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 24px 90px}
  .top{display:flex;align-items:center;gap:10px;margin:6px 4px 26px}
  .mark{width:26px;height:26px;border-radius:7px;background:var(--text);display:grid;place-items:center}
  .mark i{width:10px;height:10px;border-radius:50%;border:2.4px solid var(--bg)}
  .top b{font-size:15px;font-weight:600}.top .s{font-size:15px;color:var(--text-3)}
  .top .sp{flex:1}
  .tbtn{font:inherit;font-size:13px;font-weight:500;color:var(--text-2);background:var(--tile);border:none;cursor:pointer;
    padding:6px 13px 6px 11px;border-radius:980px;display:inline-flex;align-items:center;gap:6px}
  .tbtn:hover{color:var(--text)}.tbtn svg{width:15px;height:15px}

  .grid{display:grid;grid-template-columns:238px 1fr;gap:26px;align-items:start}
  .mback{display:none;align-items:center;gap:4px;font:inherit;font-size:14px;font-weight:600;color:var(--accent);background:none;border:0;padding:4px 2px 2px;margin:-2px 0 12px;cursor:pointer}
  @media(max-width:800px){.grid{grid-template-columns:1fr}
    .wrap[data-mv="rooms"] #main{display:none}
    .wrap[data-mv="detail"] .rooms-col{display:none}
    .mback{display:inline-flex}}
  @media(max-width:460px){.wrap{padding:18px 16px 96px}
    .postile{width:128px;min-height:52px;padding:8px 9px;gap:8px}
    .prow{gap:clamp(18px,7vw,60px)}
    .head h1{font-size:26px}}
  .eyebrow{font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.02em;margin:0 8px 8px}

  /* grouped surface */
  .group{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}

  /* room list — inset grouped, tinted icons, chevrons */
  .room{width:100%;border:none;background:none;font:inherit;color:inherit;cursor:pointer;text-align:left;
    padding:11px 13px;display:flex;align-items:center;gap:12px;position:relative;transition:background .12s}
  .room+.room::before{content:"";position:absolute;top:0;left:53px;right:0;height:.5px;background:var(--hair)}
  .room:hover{background:color-mix(in srgb,var(--text) 4%,transparent)}
  .room.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .room.droproom{box-shadow:inset 0 0 0 2px var(--accent);border-radius:12px}
  .room.droproom::before{opacity:0}
  .newroom .ric{background:none;border:1.5px dashed var(--hair-2);color:var(--text-3);border-radius:8px}
  .newroom .rmeta b{color:var(--text-2)}.ric-new{font-size:19px;font-weight:400;line-height:1}
  .layouts{display:flex;gap:7px;flex-wrap:wrap;margin:2px 2px 8px}
  .savepill{font:inherit;font-size:12px;font-weight:600;padding:5px 12px;border-radius:980px;background:var(--tile);color:var(--text);border:none;cursor:pointer}
  .savepill:hover{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
  .room.sel::before,.room.sel+.room::before{background:transparent}
  .ric{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center}
  .ric svg{width:19px;height:19px}
  .rmeta{flex:1;min-width:0}.rmeta b{display:block;font-size:14.5px;font-weight:500}.rmeta span{font-size:12px;color:var(--text-3)}
  .chev{color:var(--text-3);font-size:16px;opacity:.7}.room.sel .chev{color:var(--accent);opacity:1}

  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:0 2px 18px}
  .head-l{min-width:0}
  .menu-wrap{position:relative;flex:none}
  .hmenu-btn{width:34px;height:34px;border-radius:50%;background:var(--tile);border:none;color:var(--text-2);cursor:pointer;display:grid;place-items:center}
  .hmenu-btn svg{width:20px;height:20px}.hmenu-btn:hover{color:var(--text)}
  .menu{position:absolute;top:42px;right:0;min-width:224px;background:var(--card);border-radius:14px;border:.5px solid var(--hair);
    box-shadow:0 14px 44px -12px rgba(0,0,0,.34);padding:6px;opacity:0;transform:scale(.96) translateY(-4px);transform-origin:top right;
    pointer-events:none;transition:.16s cubic-bezier(.34,1.4,.6,1);z-index:40}
  .menu.open{opacity:1;transform:none;pointer-events:auto}
  .menu button{display:flex;align-items:center;width:100%;border:none;background:none;font:inherit;font-size:14px;color:var(--text);text-align:left;padding:9px 11px;border-radius:9px;cursor:pointer}
  .menu button:hover{background:color-mix(in srgb,var(--text) 6%,transparent)}
  .menu button.danger{color:var(--danger)}.menu button.danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent)}
  .menu .sep{height:.5px;background:var(--hair);margin:5px 9px}
  .menu .mlabel{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;padding:8px 11px 3px}
  .menu .mlayout{justify-content:space-between}
  .mdel{color:var(--text-3);font-size:12px;line-height:1;padding:3px 5px;border-radius:6px;margin:-3px -3px -3px 8px}
  .mdel:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 13%,transparent)}
  .head h1{font-size:29px;font-weight:700;letter-spacing:-.03em;margin:0}
  .chips{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .chip{font-size:12px;font-weight:600;padding:4px 11px;border-radius:980px;background:var(--tile);color:var(--text-2)}
  .chip.accent{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
  .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .btn{font:inherit;font-size:14px;font-weight:500;border-radius:980px;padding:8px 16px;cursor:pointer;border:none;transition:.12s}
  .btn:active{transform:scale(.98)}
  .btn.fill{background:var(--accent);color:#fff}.btn.fill:disabled{opacity:.4;cursor:default}
  .btn.soft{background:var(--tile);color:var(--text)}
  .btn.text{background:none;color:var(--danger);padding:8px 8px}.btn.text:hover{text-decoration:underline}

  .sec{display:flex;align-items:center;gap:8px;margin:22px 4px 11px}
  .sec h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}
  .sec .sc{font-size:12px;color:var(--text-3);margin-left:auto}

  /* ===== STAGE on a grouped card ===== */
  .stage{position:relative;padding:8px 0 10px}
  .tv{width:min(280px,54%);height:5px;border-radius:3px;background:var(--hair-2);margin:0 auto 5px;opacity:.8}
  .tvl{text-align:center;font-size:10.5px;color:var(--text-3);letter-spacing:.08em;margin-bottom:16px}
  .prow{display:flex;justify-content:center;gap:clamp(60px,16vw,200px)}.prow.fronts{margin-top:14px}.prow.rear{margin-top:6px}
  .psub{display:flex;justify-content:center;margin-top:12px}
  .lp{display:flex;flex-direction:column;align-items:center;gap:5px;margin:14px 0;pointer-events:none}
  .lp .r{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--hair-2);margin:0 auto 6px;position:relative}
  .lp .r::after{content:"";position:absolute;inset:0;margin:auto;width:5px;height:5px;border-radius:50%;background:var(--text-3)}
  .lp small{font-size:10.5px;color:var(--text-3)}

  .posw{position:relative;display:flex}
  .postile{width:152px;min-height:58px;border-radius:15px;background:var(--card);box-shadow:var(--shadow);padding:10px 12px;display:flex;align-items:center;gap:11px;position:relative;transition:box-shadow .15s,transform .2s cubic-bezier(.34,1.4,.6,1)}
  .postile.empty{background:none;border:1.5px dashed var(--hair-2)}
  .postile.over{box-shadow:0 0 0 3px var(--accent);transform:scale(1.04)}
  .badge{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;position:relative}
  .badge svg{width:23px;height:23px}
  .badge.orb{cursor:grab}.badge.orb:active{cursor:grabbing;transform:scale(.94)}.badge.dragging{opacity:.35}
  .badge.empty-badge{border:1.5px dashed var(--hair-2);color:var(--text-3);font-family:var(--mono);font-size:12px}
  .badge .rip{position:absolute;inset:0;border-radius:11px;pointer-events:none}
  .badge.chirp .rip::before,.badge.chirp .rip::after{content:"";position:absolute;inset:0;border-radius:11px;border:1.5px solid currentColor;animation:ripple 1.1s ease-out forwards}
  .badge.chirp .rip::after{animation-delay:.35s}
  .pmeta{min-width:0}.pmeta b{display:block;font-size:13px;font-weight:600;line-height:1.2}.pmeta span{font-family:var(--mono);font-size:9.5px;color:var(--text-2)}
  .tile{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;position:relative;transition:transform .25s cubic-bezier(.34,1.4,.6,1),box-shadow .15s}
  .tile svg{width:28px;height:28px}
  .tile.empty{border:1.5px dashed var(--hair-2)}
  .tile.empty .cc{font-family:var(--mono);font-size:12px;color:var(--text-3);letter-spacing:.05em}
  .t-front{background:color-mix(in srgb,var(--c-front) 16%,var(--card));color:var(--c-front)}
  .t-rear{background:color-mix(in srgb,var(--c-rear) 17%,var(--card));color:var(--c-rear)}
  .t-sub{background:color-mix(in srgb,var(--c-sub) 16%,var(--card));color:var(--c-sub)}
  .t-bar{background:color-mix(in srgb,var(--c-bar) 16%,var(--card));color:var(--c-bar)}
  .t-neutral{background:var(--tile);color:var(--text-2)}
  .tile.t-bar{width:104px;height:46px;border-radius:15px}
  .tile.over{box-shadow:0 0 0 3px var(--accent);transform:scale(1.09)}
  .plabel{text-align:center;line-height:1.25}.plabel .nm{font-size:12.5px;font-weight:600}.plabel .md{font-family:var(--mono);font-size:9px;color:var(--text-3)}
  .ctl{position:absolute;top:-6px;right:14px;display:flex;gap:5px;opacity:0;transform:translateY(2px);transition:.14s}
  .postile:hover .ctl{opacity:1;transform:none}
  .cbtn{width:26px;height:26px;border-radius:50%;background:var(--card);border:.5px solid var(--hair);color:var(--text-2);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);padding:0}
  .cbtn svg{width:14px;height:14px}.cbtn:hover{color:var(--text)}.cbtn.x:hover{color:var(--danger)}.cbtn.on{color:var(--accent);border-color:var(--accent)}
  .st{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--accent);white-space:nowrap}
  .spin{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--accent);border-top-color:transparent;animation:spin .7s linear infinite;vertical-align:-1px;margin-right:4px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .orb{cursor:grab}.orb:active{cursor:grabbing;transform:scale(.94)}.orb.dragging{opacity:.35}
  .orb .rip{position:absolute;inset:0;border-radius:50%;pointer-events:none}
  .orb.chirp .rip::before,.orb.chirp .rip::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid currentColor;animation:ripple 1.1s ease-out forwards}
  .orb.chirp .rip::after{animation-delay:.35s}
  @keyframes ripple{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.3);opacity:0}}

  /* available speakers — Home-style grouped rows */
  .rows .row{display:flex;align-items:center;gap:13px;padding:11px 14px;position:relative}
  .rows .row+.row::before{content:"";position:absolute;top:0;left:60px;right:0;height:.5px;background:var(--hair)}
  .rows .rt{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--tile);color:var(--text-2)}
  .rows .rt svg{width:24px;height:24px}
  .rows .rx{flex:1;min-width:0}.rows .rx b{display:block;font-size:14.5px;font-weight:600}.rows .rx span{font-size:11.5px;font-family:var(--mono);color:var(--text-3)}
  .chime{width:38px;height:38px;border-radius:50%;border:.5px solid var(--hair);background:var(--bg);color:var(--accent);cursor:pointer;display:grid;place-items:center;flex:none}
  .chime svg{width:19px;height:19px}.chime:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .rows .empty-note{padding:16px;color:var(--text-3);font-size:13.5px}
  .drop-hint{border:1.5px dashed var(--hair-2);border-radius:14px;padding:10px;text-align:center;font-size:12px;color:var(--text-3);margin-top:12px}
  .group.dropping{outline:2px solid var(--accent);outline-offset:3px}

  .readout{margin-top:22px}.readout .rl{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-bottom:7px}
  .readout code{display:block;font-family:var(--mono);font-size:12px;line-height:1.75;color:var(--text-2);word-break:break-all;
    background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .readout code b{color:var(--accent);font-weight:500}
  .warn{font-size:12.5px;color:var(--text-3);margin-top:16px;max-width:62ch;line-height:1.5}.warn b{color:var(--text-2);font-weight:600}

  /* pair */
  .wells{display:flex;align-items:stretch;gap:14px;margin:6px auto;max-width:560px}
  .well{flex:1;min-height:172px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:11px;position:relative;transition:.2s;padding:16px}
  .well.over{box-shadow:0 0 0 3px var(--accent),var(--shadow)}
  .well .side{position:absolute;top:14px;left:18px;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--c-front)}
  .well:last-child .side{color:var(--c-rear)}
  .well .wn{font-size:14.5px;font-weight:600}.well .wm{font-family:var(--mono);font-size:10px;color:var(--text-3)}
  .well .empty-note{color:var(--text-3);font-size:13.5px}
  .swap{width:38px;height:38px;border-radius:50%;border:.5px solid var(--hair);background:var(--card);cursor:pointer;color:var(--text-2);align-self:center;flex:none;display:grid;place-items:center;font-size:16px;box-shadow:var(--shadow)}
  .swap:hover{color:var(--accent)}
  .solo{display:flex;flex-direction:column;align-items:center;gap:13px;padding:40px;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
  .solo .wn{font-size:16px;font-weight:600}.solo .wm{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
  .ctl.pin{position:absolute;top:12px;right:14px;opacity:1;transform:none}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(10px) scale(.97);z-index:60;background:var(--card);
    border:.5px solid var(--hair);color:var(--text);font-size:13.5px;font-weight:500;padding:12px 20px;border-radius:980px;
    box-shadow:0 18px 44px -14px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.32s cubic-bezier(.34,1.4,.6,1);display:flex;align-items:center;gap:9px}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  .toast .w{color:var(--accent);display:grid;place-items:center}.toast .w svg{width:17px;height:17px}
  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
  .modal-back.on{opacity:1;pointer-events:auto}
  .modal{background:var(--card);border-radius:20px;box-shadow:0 30px 90px -24px rgba(0,0,0,.55);padding:22px 22px 18px;width:322px;max-width:90vw;transform:scale(.92);transition:transform .22s cubic-bezier(.34,1.4,.6,1)}
  .modal-back.on .modal{transform:none}
  .modal h3{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;text-align:center}
  .modal p{font-size:13px;color:var(--text-2);margin:0 0 16px;text-align:center}
  .modal input{width:100%;font:inherit;font-size:15px;padding:11px 13px;border-radius:11px;border:none;background:var(--tile);color:var(--text);outline:none;margin-bottom:16px}
  .modal input:focus{box-shadow:0 0 0 2px var(--accent)}
  .modal-btns{display:flex;gap:9px}
  .modal-btns button{flex:1;font:inherit;font-size:14px;font-weight:600;padding:10px;border-radius:11px;border:none;cursor:pointer}
  .mbtn-cancel{background:var(--tile);color:var(--text)}.mbtn-cancel:hover{background:color-mix(in srgb,var(--text) 8%,transparent)}
  .mbtn-ok{background:var(--accent);color:#fff}.mbtn-ok:disabled{opacity:.4;cursor:default}
  .tbtn.help{width:30px;height:30px;padding:0;justify-content:center;font-weight:700;font-size:15px}
  .modal.wide{width:404px;max-width:92vw;padding:26px}
  .ov-dots{display:flex;gap:7px;justify-content:center;margin:2px 0 16px}
  .ov-dots i{width:11px;height:11px;border-radius:50%;display:block}
  .ov-title{font-size:22px;font-weight:700;letter-spacing:-.02em;text-align:center;margin:0 0 5px}
  .ov-sub{font-size:13.5px;color:var(--text-2);text-align:center;line-height:1.5;margin:0 0 18px}
  .ov-tip{display:flex;gap:13px;align-items:flex-start;padding:8px 0}
  .ov-tip .ti{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center}
  .ov-tip .ti svg{width:22px;height:22px}
  .ov-tip .tt b{display:block;font-size:14px;font-weight:600;margin-bottom:1px}
  .ov-tip .tt span{font-size:12.5px;color:var(--text-2);line-height:1.45}
  .sheet{background:var(--card);border-radius:20px;box-shadow:0 30px 90px -24px rgba(0,0,0,.55);width:344px;max-width:92vw;padding:8px}
  .sheet .sh-h{text-align:center;padding:13px 10px 10px}
  .sheet .sh-h b{font-size:16px;font-weight:600;letter-spacing:-.01em}.sheet .sh-h span{display:block;font-size:12.5px;color:var(--text-2);margin-top:3px}
  .sheet button{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;font:inherit;font-size:15px;color:var(--text);padding:12px 14px;border-radius:12px;cursor:pointer;text-align:left}
  .sheet button:hover{background:color-mix(in srgb,var(--text) 6%,transparent)}
  .sheet button svg{width:19px;height:19px;color:var(--text-2);flex:none}
  .sheet .ai-txt{display:flex;flex-direction:column;gap:2px;line-height:1.3}.sheet .ai-nm{font-size:15px}.sheet .ai-sub{font-size:12.5px;color:var(--text-3)}
  .sheet button.danger{color:var(--danger)}.sheet button.danger svg{color:var(--danger)}
  .sheet button.cancel{justify-content:center;font-weight:600;background:var(--tile);margin-top:5px}
  .sw{position:relative;width:44px;height:26px;flex:none}

<script>
(function(){

  var haAreas=["Media Room","Bedroom","Guest Bedroom","Pantry","Office","Kitchen","Dining Room","Patio","Living Room","Family Room","Primary Bath","Basement","Garage","Hallway","Sunroom"];
  var $=function(s,r){return (r||document).querySelector(s)};
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

  var ICON={
    soundbar:svg('<rect x="2.8" y="9" width="18.4" height="6" rx="1.5"/><line x1="8" y1="10.7" x2="8" y2="13.3"/><line x1="12" y1="10.7" x2="12" y2="13.3"/><line x1="16" y1="10.7" x2="16" y2="13.3"/>'),
    sub:svg('<rect x="5.5" y="4" width="13" height="16" rx="4"/><circle cx="12" cy="12" r="3.4"/>'),
    era:svg('<path d="M4.4 9.4 Q4.4 7 6.8 7 L17.2 7 Q19.6 7 19.6 9.4 L19.6 14.6 Q19.6 17 17.2 17 L6.8 17 Q4.4 17 4.4 14.6 Z"/><circle cx="12" cy="12" r="2.3"/><circle cx="12" cy="4.7" r="1"/>'),
    book:svg('<rect x="7" y="3.5" width="10" height="17" rx="2.5"/><circle cx="12" cy="14" r="2.6"/><circle cx="12" cy="7" r="1"/>'),
    lamp:svg('<path d="M8 9 L16 9 L14.4 4.5 L9.6 4.5 Z"/><line x1="12" y1="9" x2="12" y2="18"/><line x1="8.5" y1="18" x2="15.5" y2="18"/>'),
    frame:svg('<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><rect x="6.6" y="8.6" width="10.8" height="6.8" rx="1"/>'),
    connect:svg('<rect x="3.5" y="8" width="17" height="8" rx="2.5"/><circle cx="17" cy="12" r="1.1" fill="currentColor" stroke="none"/>'),

  // Capability registry — one row per device family, matched top-down on the model string.
  // Icon + bonding rules derive from these tags, so adding a future device is a one-line
  // change here. Unknown models fall through to FALLBACK (a generic home speaker: can

  //   primary = can be a home-theater center (soundbar)   sub = is a subwoofer
  //   surround = can be a surround/satellite               pair = can be stereo-paired
  //   height = has up-firing Atmos drivers (height channel)
  var KINDS=[
    {re:/arc/,                       icon:"soundbar", primary:1},
    {re:/beam|ray|playbar|playbase/, icon:"soundbar", primary:1},
    {re:/sub/,                       icon:"sub",      sub:1},
    {re:/era 300/,                   icon:"era",      surround:1, pair:1, height:1},
    {re:/era/,                       icon:"era",      surround:1, pair:1},
    {re:/lamp/,                      icon:"lamp",     surround:1, pair:1},
    {re:/frame|picture/,             icon:"frame",    surround:1, pair:1},
    {re:/bookshelf/,                 icon:"book",     surround:1, pair:1},
    {re:/connect|port|amp/,          icon:"connect"},
    {re:/move|roam/,                 icon:"driver"}
  ];
  var FALLBACK={icon:"driver", surround:1, pair:1};
  function speakerKind(m){m=(m||"").toLowerCase();for(var i=0;i<KINDS.length;i++)if(KINDS[i].re.test(m))return KINDS[i];return FALLBACK;}
  function iconFor(m){return ICON[speakerKind(m).icon]||ICON.driver}

  var WAVE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.3L11.5 18V6L7.3 9.5H4z" fill="currentColor" stroke="none"/><path d="M15 9.3a4 4 0 0 1 0 5.4"/><path d="M17.7 6.5a8 8 0 0 1 0 11"/></svg>';

  var toastEl=null,tT=null;
  function toast(m){if(!toastEl){toastEl=el("div","toast");toastEl.innerHTML='<span class="w">'+WAVE+'</span><span></span>';document.body.appendChild(toastEl);}toastEl.lastChild.textContent=m;toastEl.classList.add("on");clearTimeout(tT);tT=setTimeout(function(){toastEl.classList.remove("on")},2700);}
  function identify(name,node){toast("Chiming on “"+name+"” — listen for the speaker");if(node){node.classList.add("chirp");setTimeout(function(){node.classList.remove("chirp")},1150);}}

  function orb(sp,tintCls){var t=el("div","tile orb "+(tintCls||"t-neutral"));t.draggable=true;t.innerHTML=iconFor(sp.model)+'<span class="rip"></span>';
    t.addEventListener("dragstart",function(e){drag={roomKey:current,sp:sp};t.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",sp.id)}catch(_){}} );
    t.addEventListener("dragend",function(){t.classList.remove("dragging");drag=null});return t;}
  function cbtn(cls,inner,title,fn){var b=el("button","cbtn"+(cls?" "+cls:""));b.innerHTML=inner;b.title=title;b.addEventListener("mousedown",function(e){e.stopPropagation()});b.addEventListener("click",function(e){e.stopPropagation();fn()});return b;}

  function roomTint(r){return r.type==="ht"?"t-bar":(r.pairs&&r.pairs.some(function(p){return p.L&&p.R}))?"t-front":"t-neutral"}
  function firstSpeaker(r){if(r.pairs)for(var i=0;i<r.pairs.length;i++){if(r.pairs[i].L)return r.pairs[i].L.model;if(r.pairs[i].R)return r.pairs[i].R.model}return (r.tray&&r.tray[0])?r.tray[0].model:""}
  function rGlyph(r){return iconFor(r.type==="ht"?r.bar.model:firstSpeaker(r))}
  function roomState(r){if(r.type==="ht")return "Home Theater · "+Object.keys(r.slots).length+".1";if(barIn(r))return "Soundbar · standalone";
    var np=(r.pairs||[]).filter(function(p){return p.L&&p.R}).length;
    var solo=(r.tray||[]).length+(r.pairs||[]).filter(function(p){return ((p.L?1:0)+(p.R?1:0))===1}).length;
    var parts=[];if(np)parts.push(np===1?"Stereo pair":np+" stereo pairs");if(solo)parts.push(solo+(solo===1?" speaker":" speakers"));
    return parts.length?parts.join(" + "):"No speakers";}
  function buildRooms(){var box=$("#rooms");box.innerHTML="";
    Object.keys(rooms).forEach(function(k){var r=rooms[k],b=el("button","room"+(k===current?" sel":""));b.setAttribute("aria-pressed",k===current);
      var tint=roomTint(r);
      b.innerHTML='<span class="ric '+tint+'" style="border-radius:8px">'+rGlyph(r)+'</span><span class="rmeta"><b></b><span></span></span><span class="chev">›</span>';

    renderChangeBar();
  }
  var newRoomN=0;
  function createRoomWith(d,name){if(!d)return;var sp=d.sp,src=rooms[d.roomKey];

  var AREA_IC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/></svg>';
  var PLUS_IC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>';
  function nameTaken(name){var n=(name||"").trim().toLowerCase();if(!n)return false;var t=false;Object.keys(rooms).forEach(function(k){if(rooms[k].name.toLowerCase()===n)t=true});haAreas.forEach(function(a){if(a.toLowerCase()===n)t=true});return t;}
  function pickSpace(d){var used={};Object.keys(rooms).forEach(function(k){used[rooms[k].name.toLowerCase()]=1});
    var unused=haAreas.filter(function(a){return !used[a.toLowerCase()]});

  function separatePair(r,p){var wc=p.L&&p.R;[p.L,p.R].forEach(function(mm){if(mm)r.tray.push(mm)});if(p.sub)looseSubs.push(p.sub);r.pairs=r.pairs.filter(function(x){return x!==p});toast(wc?"Pair separated":"Pairing cancelled");render();}
  function subPicker(r,p){var opts=allSubs(p);actionSheet("Add a Sub","Choose a Sub to bond to this pair",opts.map(function(o){return {label:o.sub.name+" · "+sm(o.sub.model),sub:o.loc,icon:ICON.sub,fn:function(){o.take();p.sub=Object.assign({},o.sub);toast(o.sub.name+" → Sub");render()}}}))}

  var DOTS='<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg>';

  document.addEventListener("click",closeMenus);

  function menuFrom(items,ctx){var wrap=el("div","menu-wrap");var btn=el("button","hmenu-btn");btn.innerHTML=DOTS;btn.title="Options";btn.setAttribute("aria-label","Options");

    btn.onclick=function(e){e.stopPropagation();var was=menu.classList.contains("open");closeMenus();if(!was)menu.classList.add("open")};
    wrap.appendChild(btn);wrap.appendChild(menu);return wrap;}
  var UPI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 14 12 8.5 18 14"/></svg>';
  var RMI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>';
  function actionSheet(title,subtitle,items){var back=el("div","modal-back"),sheet=el("div","sheet");
    var h=el("div","sh-h");h.innerHTML='<b></b><span></span>';$("b",h).textContent=title;$("span",h).textContent=subtitle||"";sheet.appendChild(h);

    items.forEach(function(it){var b=el("button",it.danger?"danger":"");b.innerHTML=(it.icon||"")+'<span class="ai-txt"><span class="ai-nm"></span>'+(it.sub?'<span class="ai-sub"></span>':'')+'</span>';b.querySelector(".ai-nm").textContent=it.label;if(it.sub)b.querySelector(".ai-sub").textContent=it.sub;b.onclick=function(e){e.stopPropagation();close();it.fn()};sheet.appendChild(b)});

  function audioSheet(obj,kind,title){
    obj.audio=obj.audio||{bass:0,treble:0,loudness:false,sub:6,surround:6,height:4,night:false,dialog:false,trueplay:true,balance:0};
    var a=obj.audio,back=el("div","modal-back"),sheet=el("div","modal aset");
    function close(){back.classList.remove("on");setTimeout(function(){back.remove()},220)}
    var h=el("div","aset-h");h.innerHTML='<b>Audio</b><div></div>';h.querySelector("div").textContent=title;sheet.appendChild(h);
    function lbl(t){return el("div","aset-lbl",t)}
    function sliderRow(label,key,min,max,fmt){var row=el("div","aset-row");row.appendChild(el("div","rl",label));
      var rc=el("div","rc"),val=el("span","rv"),inp=el("input","sl");inp.type="range";inp.min=min;inp.max=max;inp.step=1;inp.value=a[key];
      function upd(){val.textContent=fmt(a[key])}inp.addEventListener("input",function(){a[key]=+inp.value;upd()});upd();

    function toggleRow(label,key){var row=el("div","aset-row");row.appendChild(el("div","rl",label));

      sw.appendChild(inp);sw.appendChild(el("span","tr"));sw.appendChild(el("span","kn"));row.appendChild(sw);return row;}
    var dB=function(v){return (v>0?"+":"")+v+" dB"},lvl=function(v){return ""+v},bal=function(v){return v===0?"Center":(v<0?"L "+(-v):"R "+v)};
    function group(rows){var g=el("div","aset-group");rows.forEach(function(x){g.appendChild(x)});return g}
    sheet.appendChild(lbl("Tone"));sheet.appendChild(group([sliderRow("Bass","bass",-10,10,dB),sliderRow("Treble","treble",-10,10,dB),toggleRow("Loudness","loudness")]));
    if(kind==="ht"){sheet.appendChild(lbl("Home theater"));sheet.appendChild(group([sliderRow("Sub level","sub",0,10,lvl),sliderRow("Surround level","surround",0,10,lvl),sliderRow("Height level","height",0,10,lvl),toggleRow("Night sound","night"),toggleRow("Speech clarity","dialog")]));}
    if(kind==="pair"){sheet.appendChild(lbl("Stereo pair"));sheet.appendChild(group([sliderRow("Balance","balance",-5,5,bal)]));}
    sheet.appendChild(lbl("Tuning"));sheet.appendChild(group([toggleRow("Trueplay","trueplay")]));
    var done=el("button","btn fill");done.textContent="Done";done.style.cssText="width:100%;margin-top:18px";done.onclick=close;sheet.appendChild(done);
    back.addEventListener("click",function(e){if(e.target===back)close()});
    back.appendChild(sheet);document.body.appendChild(back);requestAnimationFrame(function(){back.classList.add("on")});}
  // ── Staged changes ────────────────────────────────────────────────────────────
  // Every edit mutates the working model instantly; nothing touches the speakers until
  // Apply. The change log is the live diff between the working model and `applied` (the
  // last state committed to the devices) — so it's always in sync and Discard just
  // restores the baseline. This is the transaction boundary the real integration needs.
  function clone(x){return JSON.parse(JSON.stringify(x))}
  var applied=null;
  function assignMap(state){var map={};
    Object.keys(state.rooms).forEach(function(k){var r=state.rooms[k];
      function put(sp,role){if(sp)map[sp.id]={room:r.name,role:role,height:!!sp.height,name:sp.name}}
      if(r.type==="ht"){put(r.bar,"Center");CH.forEach(function(ch){put(r.slots[ch],ch==="SW"?"Sub":CHNAME[ch])});(r.tray||[]).forEach(function(s){put(s,"available")});}
      else {(r.pairs||[]).forEach(function(p){if(p.L&&p.R){put(p.L,"Left");put(p.R,"Right");put(p.sub,"Sub")}else{var mm=p.L||p.R;if(mm)put(mm,"standalone")}});(r.tray||[]).forEach(function(s){put(s,"standalone")});}});
    (state.subs||[]).forEach(function(s){map[s.id]={room:"available",role:"idle",height:false,name:s.name}});
    return map;}
  function labelFor(e){if(e.role==="idle")return "Available";if(e.role==="standalone")return e.room+" · standalone";return e.room+" · "+e.role+(e.height?" + height":"");}
  function computeChanges(){if(!applied)return [];var A=assignMap(applied),B=assignMap({rooms:rooms,subs:looseSubs}),out=[];
    Object.keys(B).forEach(function(id){var b=B[id],a=A[id];
      if(!a){out.push({name:b.name,from:"New",to:labelFor(b)});return;}
      if(a.room!==b.room||a.role!==b.role||a.height!==b.height)out.push({name:b.name,from:labelFor(a),to:labelFor(b)});});
    return out;}
  // Synthesise the pending diff into atomic operations, each tagged with the device UIDs
  // it touches. Ops sharing a device must serialise; disjoint ops run in parallel — so the
  // apply plan (planLanes) falls straight out of a union-find over touch-sets.
  function uniq(a){var s={},o=[];a.forEach(function(x){if(!s[x]){s[x]=1;o.push(x)}});return o;}
  function computeOps(){if(!applied)return [];
    var A=assignMap(applied),B=assignMap({rooms:rooms,subs:looseSubs});
    function changed(id){var a=A[id],b=B[id];if(!a&&b)return true;if(a&&!b)return true;return !!a&&!!b&&(a.room!==b.room||a.role!==b.role||a.height!==b.height);}
    var ops=[];
    Object.keys(rooms).forEach(function(k){var r=rooms[k],av=applied.rooms[k];
      if(r.type==="ht"){var mem=[];if(r.bar)mem.push(r.bar.id);CH.forEach(function(ch){if(r.slots[ch])mem.push(r.slots[ch].id)});
        if(av&&av.type==="ht"){if(av.bar)mem.push(av.bar.id);CH.forEach(function(ch){if(av.slots&&av.slots[ch])mem.push(av.slots[ch].id)})}
        mem=uniq(mem);var cnt=Object.keys(r.slots).filter(function(c){return r.slots[c]}).length;
        if(mem.some(changed))ops.push({kind:"ht",title:r.name,note:(av&&av.type==="ht"?"Update home theater":"Set up home theater"),ic:"soundbar",touch:mem,order:2});
      }else{(r.pairs||[]).forEach(function(p){if(p.L&&p.R){var mem=[p.L.id,p.R.id];if(p.sub)mem.push(p.sub.id);
          if(mem.some(changed))ops.push({kind:"pair",title:r.name,note:"Create stereo pair"+(p.sub?" with Sub":""),ic:"pair",touch:mem,order:2})}});
        (r.tray||[]).forEach(function(s){if(changed(s.id))ops.push({kind:"move",title:s.name,note:"Move to "+r.name,ic:"move",touch:[s.id],order:1})})}
    });
    Object.keys(applied.rooms).forEach(function(k){var av=applied.rooms[k],wv=rooms[k];
      if(av.type==="ht"&&(!wv||wv.type!=="ht")){var mem=[];if(av.bar)mem.push(av.bar.id);CH.forEach(function(ch){if(av.slots&&av.slots[ch])mem.push(av.slots[ch].id)});mem=uniq(mem);
        if(mem.some(changed))ops.push({kind:"separate",title:av.name,note:"Separate home theater",ic:"soundbar",touch:mem,order:0})}
    });
    (looseSubs||[]).forEach(function(s){if(changed(s.id))ops.push({kind:"move",title:s.name,note:"Return to available",ic:"move",touch:[s.id],order:1})});
    return ops;}
  function planLanes(ops){var parent=ops.map(function(_,i){return i});
    function find(x){while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x]}return x}
    function union(a,b){parent[find(a)]=find(b)}
    var byDev={};ops.forEach(function(op,i){op.touch.forEach(function(d){if(byDev[d]!=null)union(i,byDev[d]);byDev[d]=i})});
    var lanes={};ops.forEach(function(op,i){var r=find(i);(lanes[r]=lanes[r]||[]).push(op)});
    return Object.keys(lanes).map(function(k){return lanes[k].sort(function(a,b){return a.order-b.order})});}
  function applyChanges(){var n=computeChanges().length;if(!n)return;var bar=$("#changebar");if(bar)bar.classList.add("busy");
    toast("Applying "+n+" change"+(n>1?"s":"")+" to your Sonos…");
    setTimeout(function(){applied={rooms:clone(rooms),subs:clone(looseSubs)};toast("Applied — your speakers are set");render();},1200);}
  var PAIR_IC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8.6" cy="12" r="4.3"/><circle cx="15.4" cy="12" r="4.3"/></svg>';
  var CHECK_IC='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12.5 10 17 19 7.5"/></svg>';
  function opIcon(op){return op.ic==="move"?MOVE:op.ic==="pair"?PAIR_IC:op.ic==="soundbar"?ICON.soundbar:ICON.driver}
  function applyPlanModal(){var ops=computeOps();if(!ops.length){applyChanges();return;}
    var lanes=planLanes(ops),back=el("div","modal-back"),modal=el("div","modal plan");
    function close(){back.classList.remove("on");setTimeout(function(){back.remove()},220)}
    var h=el("div","plan-h");h.innerHTML='<b>Apply changes?</b><span></span>';
    h.querySelector("span").textContent="Chorus will update your Sonos to match — "+ops.length+" change"+(ops.length>1?"s":"")+".";
    modal.appendChild(h);
    var list=el("div","plan-list");
    ops.forEach(function(op,i){var row=el("div","plan-row");row.setAttribute("data-i",i);
      row.innerHTML='<span class="pr-ic"></span><span class="pr-tx"><b></b><span></span></span><span class="pr-state">'+CHECK_IC+'</span>';
      row.querySelector(".pr-ic").innerHTML=opIcon(op);row.querySelector(".pr-tx b").textContent=op.title||"";row.querySelector(".pr-tx>span").textContent=op.note||"";
      list.appendChild(row)});
    modal.appendChild(list);
    modal.appendChild(el("div","plan-note","Applied safely — you can change anything back anytime."));
    var btns=el("div","plan-btns"),cancel=el("button","btn soft","Cancel"),run=el("button","btn fill");
    run.textContent="Apply";cancel.onclick=close;
    run.onclick=function(){cancel.disabled=true;run.disabled=true;run.textContent="Applying…";modal.classList.add("running");runPlan(modal,ops,lanes,function(){applied={rooms:clone(rooms),subs:clone(looseSubs)};close();toast("Your Sonos is updated");render()})};
    btns.appendChild(cancel);btns.appendChild(run);modal.appendChild(btns);
    back.addEventListener("click",function(e){if(e.target===back&&!run.disabled)close()});
    back.appendChild(modal);document.body.appendChild(back);requestAnimationFrame(function(){back.classList.add("on")})}
  // Independent changes tick off together, dependent ones cascade — the parallelism is
  // felt (it's quick) but never named.
  function runPlan(modal,ops,lanes,done){var step=520,maxLen=0;
    lanes.forEach(function(lane){maxLen=Math.max(maxLen,lane.length);
      lane.forEach(function(op,oi){var idx=ops.indexOf(op),row=modal.querySelector('.plan-row[data-i="'+idx+'"]');
        setTimeout(function(){if(row)row.classList.add("doing")},oi*step+140);
        setTimeout(function(){if(row){row.classList.remove("doing");row.classList.add("done")}},(oi+1)*step+140)})});
    setTimeout(done,maxLen*step+520)}
  function discardChanges(){if(!applied)return;rooms=clone(applied.rooms);looseSubs=clone(applied.subs);if(!rooms[current])current=Object.keys(rooms)[0];toast("Changes discarded");render();}
  function renderChangeBar(){var bar=$("#changebar");if(!bar){bar=el("div","changebar");bar.id="changebar";document.body.appendChild(bar);}
    var ch=computeChanges(),wasOpen=bar.classList.contains("open");
    if(!ch.length){bar.classList.remove("on","open","busy");bar.innerHTML="";return;}
    bar.innerHTML="";
    var head=el("div","cb-head"),info=el("button","cb-info"),acts=el("div","cb-acts");
    info.innerHTML='<span class="cb-dot"></span><b>'+ch.length+' pending change'+(ch.length>1?'s':'')+'</b><span class="cb-tog">Details</span>';
    var disc=el("button","cb-disc","Discard"),app=el("button","cb-apply","Apply");
    disc.onclick=discardChanges;app.onclick=applyPlanModal;acts.appendChild(disc);acts.appendChild(app);
    head.appendChild(info);head.appendChild(acts);bar.appendChild(head);
    var list=el("div","cb-list");
    ch.forEach(function(c){var row=el("div","cb-row");row.innerHTML='<b></b><span class="cb-from"></span><span class="cb-arw">→</span><span class="cb-to"></span>';
      $("b",row).textContent=c.name;$(".cb-from",row).textContent=c.from;$(".cb-to",row).textContent=c.to;list.appendChild(row);});
    bar.appendChild(list);
    info.onclick=function(){bar.classList.toggle("open")};
    bar.classList.add("on");if(wasOpen)bar.classList.add("open");}
  function mv(v){var w=$(".wrap");if(w)w.setAttribute("data-mv",v)}
  function mbackBar(){var b=el("button","mback");b.innerHTML="‹ All rooms";b.onclick=function(){mv("rooms")};return b;}
  function shell(){var m=$("#main");m.innerHTML="";m.appendChild(mbackBar());return m;}
  function render(){buildRooms();var r=rooms[current];r.type==="ht"?renderHT(r):barIn(r)?renderBarSetup(r):renderRoom(r)}
  var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="21.5" y2="12"/><line x1="5.3" y1="5.3" x2="6.7" y2="6.7"/><line x1="17.3" y1="17.3" x2="18.7" y2="18.7"/><line x1="5.3" y1="18.7" x2="6.7" y2="17.3"/><line x1="17.3" y1="6.7" x2="18.7" y2="5.3"/></svg>';
  var MOON='<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M21 12.9A8.5 8.5 0 1 1 11.1 3a6.7 6.7 0 0 0 9.9 9.9z"/></svg>';
  function curTheme(){return document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}
  function setThemeBtn(){var t=curTheme();$("#themeBtn").innerHTML=(t==="dark"?MOON+"<span>Dark</span>":SUN+"<span>Light</span>")}
  $("#themeBtn").onclick=function(){document.documentElement.setAttribute("data-theme",curTheme()==="dark"?"light":"dark");setThemeBtn()};
  setThemeBtn();
  $("#helpBtn").onclick=overviewModal;
  applied={rooms:clone(rooms),subs:clone(looseSubs)};
  mv("rooms");
  render();
  overviewModal();
})();
