<title>Chorus — a Sonos speaker manager for Home Assistant</title>
<style>
  :root{
    --bg:#f2f2f7;--card:#fff;--tile:#e9e9ee;--hair:rgba(60,60,67,.2);--hair-2:rgba(60,60,67,.32);
    --text:#1d1d1f;--text-2:rgba(60,60,67,.74);--text-3:rgba(60,60,67,.55);
    --accent:#007aff;--danger:#ff3b30;
    --c-front:#007aff;--c-rear:#30b0c7;--c-sub:#5856d6;--c-bar:#007aff;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 26px -18px rgba(0,0,0,.22);
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#000;--card:#1c1c1e;--tile:#2c2c2e;--hair:rgba(235,235,245,.16);--hair-2:rgba(235,235,245,.26);
    --text:#f5f5f7;--text-2:rgba(235,235,245,.74);--text-3:rgba(235,235,245,.58);
    --accent:#0a84ff;--danger:#ff453a;
    --c-front:#0a84ff;--c-rear:#40cbe0;--c-sub:#7d7aff;--c-bar:#0a84ff;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.7);
  }}
  :root[data-theme="light"]{--bg:#f2f2f7;--card:#fff;--tile:#e9e9ee;--hair:rgba(60,60,67,.2);--hair-2:rgba(60,60,67,.32);--text:#1d1d1f;--text-2:rgba(60,60,67,.74);--text-3:rgba(60,60,67,.55);--accent:#007aff;--danger:#ff3b30;--c-front:#007aff;--c-rear:#30b0c7;--c-sub:#5856d6;--c-bar:#007aff;--shadow:0 1px 2px rgba(0,0,0,.05),0 10px 26px -18px rgba(0,0,0,.22);}
  :root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tile:#2c2c2e;--hair:rgba(235,235,245,.16);--hair-2:rgba(235,235,245,.26);--text:#f5f5f7;--text-2:rgba(235,235,245,.74);--text-3:rgba(235,235,245,.58);--accent:#0a84ff;--danger:#ff453a;--c-front:#0a84ff;--c-rear:#40cbe0;--c-sub:#7d7aff;--c-bar:#0a84ff;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.7);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);letter-spacing:-.014em;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 24px 90px}
  .top{display:flex;align-items:center;gap:10px;margin:6px 4px 26px}
  .mark{width:26px;height:26px;border-radius:7px;background:var(--text);display:grid;place-items:center}
  .mark i{width:10px;height:10px;border-radius:50%;border:2.4px solid var(--bg)}
  .top b{font-size:15px;font-weight:600}.top .s{font-size:15px;color:var(--text-3)}
  .top .sp{flex:1}
  .tbtn{font:inherit;font-size:13px;font-weight:500;color:var(--text-2);background:var(--tile);border:none;cursor:pointer;
    padding:6px 13px 6px 11px;border-radius:980px;display:inline-flex;align-items:center;gap:6px}
  .tbtn:hover{color:var(--text)}.tbtn svg{width:15px;height:15px}

  .grid{display:grid;grid-template-columns:238px 1fr;gap:26px;align-items:start}
  @media(max-width:800px){.grid{grid-template-columns:1fr}}
  .eyebrow{font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.02em;margin:0 8px 8px}

  /* grouped surface */
  .group{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}

  /* room list — inset grouped, tinted icons, chevrons */
  .room{width:100%;border:none;background:none;font:inherit;color:inherit;cursor:pointer;text-align:left;
    padding:11px 13px;display:flex;align-items:center;gap:12px;position:relative;transition:background .12s}
  .room+.room::before{content:"";position:absolute;top:0;left:53px;right:0;height:.5px;background:var(--hair)}
  .room:hover{background:color-mix(in srgb,var(--text) 4%,transparent)}
  .room.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .room.droproom{box-shadow:inset 0 0 0 2px var(--accent);border-radius:12px}
  .room.droproom::before{opacity:0}
  .newroom .ric{background:none;border:1.5px dashed var(--hair-2);color:var(--text-3);border-radius:8px}
  .newroom .rmeta b{color:var(--text-2)}.ric-new{font-size:19px;font-weight:400;line-height:1}
  .layouts{display:flex;gap:7px;flex-wrap:wrap;margin:2px 2px 8px}
  .savepill{font:inherit;font-size:12px;font-weight:600;padding:5px 12px;border-radius:980px;background:var(--tile);color:var(--text);border:none;cursor:pointer}
  .savepill:hover{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
  .room.sel::before,.room.sel+.room::before{background:transparent}
  .ric{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center}
  .ric svg{width:19px;height:19px}
  .rmeta{flex:1;min-width:0}.rmeta b{display:block;font-size:14.5px;font-weight:500}.rmeta span{font-size:12px;color:var(--text-3)}
  .chev{color:var(--text-3);font-size:16px;opacity:.7}.room.sel .chev{color:var(--accent);opacity:1}

  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:0 2px 18px}
  .head-l{min-width:0}
  .menu-wrap{position:relative;flex:none}
  .hmenu-btn{width:34px;height:34px;border-radius:50%;background:var(--tile);border:none;color:var(--text-2);cursor:pointer;display:grid;place-items:center}
  .hmenu-btn svg{width:20px;height:20px}.hmenu-btn:hover{color:var(--text)}
  .menu{position:absolute;top:42px;right:0;min-width:224px;background:var(--card);border-radius:14px;border:.5px solid var(--hair);
    box-shadow:0 14px 44px -12px rgba(0,0,0,.34);padding:6px;opacity:0;transform:scale(.96) translateY(-4px);transform-origin:top right;
    pointer-events:none;transition:.16s cubic-bezier(.34,1.4,.6,1);z-index:40}
  .menu.open{opacity:1;transform:none;pointer-events:auto}
  .menu button{display:flex;align-items:center;width:100%;border:none;background:none;font:inherit;font-size:14px;color:var(--text);text-align:left;padding:9px 11px;border-radius:9px;cursor:pointer}
  .menu button:hover{background:color-mix(in srgb,var(--text) 6%,transparent)}
  .menu button.danger{color:var(--danger)}.menu button.danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent)}
  .menu .sep{height:.5px;background:var(--hair);margin:5px 9px}
  .menu .mlabel{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;padding:8px 11px 3px}
  .menu .mlayout{justify-content:space-between}
  .mdel{color:var(--text-3);font-size:12px;line-height:1;padding:3px 5px;border-radius:6px;margin:-3px -3px -3px 8px}
  .mdel:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 13%,transparent)}
  .head h1{font-size:29px;font-weight:700;letter-spacing:-.03em;margin:0}
  .chips{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .chip{font-size:12px;font-weight:600;padding:4px 11px;border-radius:980px;background:var(--tile);color:var(--text-2)}
  .chip.accent{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
  .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .btn{font:inherit;font-size:14px;font-weight:500;border-radius:980px;padding:8px 16px;cursor:pointer;border:none;transition:.12s}
  .btn:active{transform:scale(.98)}
  .btn.fill{background:var(--accent);color:#fff}.btn.fill:disabled{opacity:.4;cursor:default}
  .btn.soft{background:var(--tile);color:var(--text)}
  .btn.text{background:none;color:var(--danger);padding:8px 8px}.btn.text:hover{text-decoration:underline}

  .sec{display:flex;align-items:center;gap:8px;margin:22px 4px 11px}
  .sec h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}
  .sec .sc{font-size:12px;color:var(--text-3);margin-left:auto}

  /* ===== STAGE on a grouped card ===== */
  .stage{position:relative;padding:8px 0 10px}
  .tv{width:min(280px,54%);height:5px;border-radius:3px;background:var(--hair-2);margin:0 auto 5px;opacity:.8}
  .tvl{text-align:center;font-size:10.5px;color:var(--text-3);letter-spacing:.08em;margin-bottom:16px}
  .prow{display:flex;justify-content:center;gap:clamp(60px,16vw,200px)}.prow.fronts{margin-top:14px}.prow.rear{margin-top:6px}
  .psub{display:flex;justify-content:center;margin-top:12px}
  .lp{display:flex;flex-direction:column;align-items:center;gap:5px;margin:14px 0;pointer-events:none}
  .lp .r{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--hair-2);margin:0 auto 6px;position:relative}
  .lp .r::after{content:"";position:absolute;inset:0;margin:auto;width:5px;height:5px;border-radius:50%;background:var(--text-3)}
  .lp small{font-size:10.5px;color:var(--text-3)}

  .posw{position:relative;display:flex}
  .postile{width:152px;min-height:58px;border-radius:15px;background:var(--card);box-shadow:var(--shadow);padding:10px 12px;display:flex;align-items:center;gap:11px;position:relative;transition:box-shadow .15s,transform .2s cubic-bezier(.34,1.4,.6,1)}
  .postile.empty{background:none;border:1.5px dashed var(--hair-2)}
  .postile.over{box-shadow:0 0 0 3px var(--accent);transform:scale(1.04)}
  .badge{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;position:relative}
  .badge svg{width:23px;height:23px}
  .badge.orb{cursor:grab}.badge.orb:active{cursor:grabbing;transform:scale(.94)}.badge.dragging{opacity:.35}
  .badge.empty-badge{border:1.5px dashed var(--hair-2);color:var(--text-3);font-family:var(--mono);font-size:12px}
  .badge .rip{position:absolute;inset:0;border-radius:11px;pointer-events:none}
  .badge.chirp .rip::before,.badge.chirp .rip::after{content:"";position:absolute;inset:0;border-radius:11px;border:1.5px solid currentColor;animation:ripple 1.1s ease-out forwards}
  .badge.chirp .rip::after{animation-delay:.35s}
  .pmeta{min-width:0}.pmeta b{display:block;font-size:13px;font-weight:600;line-height:1.2}.pmeta span{font-family:var(--mono);font-size:9.5px;color:var(--text-2)}
  .tile{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;position:relative;transition:transform .25s cubic-bezier(.34,1.4,.6,1),box-shadow .15s}
  .tile svg{width:28px;height:28px}
  .tile.empty{border:1.5px dashed var(--hair-2)}
  .tile.empty .cc{font-family:var(--mono);font-size:12px;color:var(--text-3);letter-spacing:.05em}
  .t-front{background:color-mix(in srgb,var(--c-front) 16%,var(--card));color:var(--c-front)}
  .t-rear{background:color-mix(in srgb,var(--c-rear) 17%,var(--card));color:var(--c-rear)}
  .t-sub{background:color-mix(in srgb,var(--c-sub) 16%,var(--card));color:var(--c-sub)}
  .t-bar{background:color-mix(in srgb,var(--c-bar) 16%,var(--card));color:var(--c-bar)}
  .t-neutral{background:var(--tile);color:var(--text-2)}
  .tile.t-bar{width:104px;height:46px;border-radius:15px}
  .tile.over{box-shadow:0 0 0 3px var(--accent);transform:scale(1.09)}
  .plabel{text-align:center;line-height:1.25}.plabel .nm{font-size:12.5px;font-weight:600}.plabel .md{font-family:var(--mono);font-size:9px;color:var(--text-3)}
  .ctl{position:absolute;top:-6px;right:14px;display:flex;gap:5px;opacity:0;transform:translateY(2px);transition:.14s}
  .postile:hover .ctl{opacity:1;transform:none}
  .cbtn{width:26px;height:26px;border-radius:50%;background:var(--card);border:.5px solid var(--hair);color:var(--text-2);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);padding:0}
  .cbtn svg{width:14px;height:14px}.cbtn:hover{color:var(--text)}.cbtn.x:hover{color:var(--danger)}.cbtn.on{color:var(--accent);border-color:var(--accent)}
  .st{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--accent);white-space:nowrap}
  .spin{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--accent);border-top-color:transparent;animation:spin .7s linear infinite;vertical-align:-1px;margin-right:4px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .orb{cursor:grab}.orb:active{cursor:grabbing;transform:scale(.94)}.orb.dragging{opacity:.35}
  .orb .rip{position:absolute;inset:0;border-radius:50%;pointer-events:none}
  .orb.chirp .rip::before,.orb.chirp .rip::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid currentColor;animation:ripple 1.1s ease-out forwards}
  .orb.chirp .rip::after{animation-delay:.35s}
  @keyframes ripple{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.3);opacity:0}}

  /* available speakers — Home-style grouped rows */
  .rows .row{display:flex;align-items:center;gap:13px;padding:11px 14px;position:relative}
  .rows .row+.row::before{content:"";position:absolute;top:0;left:60px;right:0;height:.5px;background:var(--hair)}
  .rows .rt{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--tile);color:var(--text-2)}
  .rows .rt svg{width:24px;height:24px}
  .rows .rx{flex:1;min-width:0}.rows .rx b{display:block;font-size:14.5px;font-weight:600}.rows .rx span{font-size:11.5px;font-family:var(--mono);color:var(--text-3)}
  .chime{width:38px;height:38px;border-radius:50%;border:.5px solid var(--hair);background:var(--bg);color:var(--accent);cursor:pointer;display:grid;place-items:center;flex:none}
  .chime svg{width:19px;height:19px}.chime:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .rows .empty-note{padding:16px;color:var(--text-3);font-size:13.5px}
  .drop-hint{border:1.5px dashed var(--hair-2);border-radius:14px;padding:10px;text-align:center;font-size:12px;color:var(--text-3);margin-top:12px}

  .readout{margin-top:22px}.readout .rl{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-bottom:7px}
  .readout code{display:block;font-family:var(--mono);font-size:12px;line-height:1.75;color:var(--text-2);word-break:break-all;
    background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .readout code b{color:var(--accent);font-weight:500}
  .warn{font-size:12.5px;color:var(--text-3);margin-top:16px;max-width:62ch;line-height:1.5}.warn b{color:var(--text-2);font-weight:600}

  /* pair */
  .wells{display:flex;align-items:stretch;gap:14px;margin:6px 0;max-width:560px}
  .well{flex:1;min-height:172px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:11px;position:relative;transition:.2s;padding:16px}
  .well.over{box-shadow:0 0 0 3px var(--accent),var(--shadow)}
  .well .side{position:absolute;top:14px;left:18px;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--c-front)}
  .well:last-child .side{color:var(--c-rear)}
  .well .wn{font-size:14.5px;font-weight:600}.well .wm{font-family:var(--mono);font-size:10px;color:var(--text-3)}
  .well .empty-note{color:var(--text-3);font-size:13.5px}
  .swap{width:38px;height:38px;border-radius:50%;border:.5px solid var(--hair);background:var(--card);cursor:pointer;color:var(--text-2);align-self:center;flex:none;display:grid;place-items:center;font-size:16px;box-shadow:var(--shadow)}
  .swap:hover{color:var(--accent)}
  .solo{display:flex;flex-direction:column;align-items:center;gap:13px;padding:40px;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
  .solo .wn{font-size:16px;font-weight:600}.solo .wm{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
  .ctl.pin{position:absolute;top:12px;right:14px;opacity:1;transform:none}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(10px) scale(.97);z-index:60;background:var(--card);
    border:.5px solid var(--hair);color:var(--text);font-size:13.5px;font-weight:500;padding:12px 20px;border-radius:980px;
    box-shadow:0 18px 44px -14px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.32s cubic-bezier(.34,1.4,.6,1);display:flex;align-items:center;gap:9px}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  .toast .w{color:var(--accent);display:grid;place-items:center}.toast .w svg{width:17px;height:17px}
  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
  .modal-back.on{opacity:1;pointer-events:auto}
  .modal{background:var(--card);border-radius:20px;box-shadow:0 30px 90px -24px rgba(0,0,0,.55);padding:22px 22px 18px;width:322px;max-width:90vw;transform:scale(.92);transition:transform .22s cubic-bezier(.34,1.4,.6,1)}
  .modal-back.on .modal{transform:none}
  .modal h3{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;text-align:center}
  .modal p{font-size:13px;color:var(--text-2);margin:0 0 16px;text-align:center}
  .modal input{width:100%;font:inherit;font-size:15px;padding:11px 13px;border-radius:11px;border:none;background:var(--tile);color:var(--text);outline:none;margin-bottom:16px}
  .modal input:focus{box-shadow:0 0 0 2px var(--accent)}
  .modal-btns{display:flex;gap:9px}
  .modal-btns button{flex:1;font:inherit;font-size:14px;font-weight:600;padding:10px;border-radius:11px;border:none;cursor:pointer}
  .mbtn-cancel{background:var(--tile);color:var(--text)}.mbtn-cancel:hover{background:color-mix(in srgb,var(--text) 8%,transparent)}
  .mbtn-ok{background:var(--accent);color:#fff}.mbtn-ok:disabled{opacity:.4;cursor:default}
  .tbtn.help{width:30px;height:30px;padding:0;justify-content:center;font-weight:700;font-size:15px}
  .modal.wide{width:404px;max-width:92vw;padding:26px}
  .ov-dots{display:flex;gap:7px;justify-content:center;margin:2px 0 16px}
  .ov-dots i{width:11px;height:11px;border-radius:50%;display:block}
  .ov-title{font-size:22px;font-weight:700;letter-spacing:-.02em;text-align:center;margin:0 0 5px}
  .ov-sub{font-size:13.5px;color:var(--text-2);text-align:center;line-height:1.5;margin:0 0 18px}
  .ov-tip{display:flex;gap:13px;align-items:flex-start;padding:8px 0}
  .ov-tip .ti{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center}
  .ov-tip .ti svg{width:22px;height:22px}
  .ov-tip .tt b{display:block;font-size:14px;font-weight:600;margin-bottom:1px}
  .ov-tip .tt span{font-size:12.5px;color:var(--text-2);line-height:1.45}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="top"><span class="mark"><i></i></span><b>Chorus</b><span class="s">for Sonos</span><span class="sp"></span><button class="tbtn help" id="helpBtn" aria-label="Overview" title="Overview">?</button><button class="tbtn" id="themeBtn">Appearance</button></div>
  <div class="grid">
    <div><div class="eyebrow">Rooms</div><div class="group" id="rooms"></div></div>
    <div id="main"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var rooms={
    media:{name:"Media Room",type:"ht",bar:{id:"arc",name:"Arc SL",model:"Arc SL"},
      slots:{LF:{id:"sym-bk1",name:"Bookshelf",model:"Symfonisk Bookshelf",height:false},RF:{id:"sym-bk2",name:"Bookshelf",model:"Symfonisk Bookshelf",height:false},
        LR:{id:"sym-pf1",name:"Picture frame",model:"Symfonisk Picture frame",height:false},RR:{id:"sym-pf2",name:"Picture frame",model:"Symfonisk Picture frame",height:false},SW:{id:"submini",name:"Sub Mini",model:"Sonos Sub Mini"}},
      tray:[{id:"era1",name:"Media Room 2",model:"Era 300"},{id:"era2",name:"Media Room 3",model:"Era 300"}]},
    bedroom:{name:"Bedroom",type:"pair",L:{id:"lamp1",name:"Bedroom",model:"Symfonisk Lamp"},R:{id:"lamp2",name:"Bedroom",model:"Symfonisk Lamp"},tray:[]},
    guest:{name:"Guest Bedroom",type:"pair",L:{id:"gl1",name:"Guest",model:"Symfonisk Lamp"},R:{id:"gl2",name:"Guest",model:"Symfonisk Lamp"},tray:[]},
    pantry:{name:"Pantry",type:"music",L:null,R:null,tray:[{id:"p1",name:"Pantry",model:"Symfonisk Bookshelf"},{id:"p2",name:"Unnamed Room",model:"Symfonisk Bookshelf"}]},

    if(!sp){var e=el("div","solo");e.innerHTML='<div class="wn" style="color:var(--text-2)">This room has no speakers</div><div class="wm" style="max-width:32ch;text-align:center">Move one in by dropping it onto “'+r.name+'” in the sidebar.</div>';m.appendChild(e);return;}
    var s=el("div","solo");var t=orb(sp,"t-neutral");s.appendChild(t);s.appendChild(el("div","wn",sp.name));s.appendChild(el("div","wm",sm(sp.model)+" · standalone"));
    var b=el("button","btn soft","Chime to identify");b.onclick=function(){identify(sp.name,t)};s.appendChild(b);m.appendChild(s);}

  var DOTS='<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg>';
  function closeMenus(){var o=document.querySelectorAll(".menu.open");for(var i=0;i<o.length;i++)o[i].classList.remove("open")}
  document.addEventListener("click",closeMenus);
  function roomMenu(r){var items=[];
    if(r.type==="ht"){items.push(["Save current layout",0,function(){nameModal({title:"Save layout",message:"Give this speaker layout a name",placeholder:"e.g. Movie 5.1",confirmLabel:"Save",onConfirm:function(n){saveLayout(r,n)}})}]);
      if(r.saved&&r.saved.length){items.push(["header","Saved layouts"]);r.saved.forEach(function(s){items.push(["layout",s])});}
      items.push(["sep"]);items.push(["Separate all speakers",1,function(){dissolve(r)}]);}
    else if(r.type==="pair"){items.push(["Swap left / right",0,function(){var t=r.L;r.L=r.R;r.R=t;renderPair(r)}]);
      items.push(["sep"]);items.push(["Unpair",1,function(){unpair(r)}]);}
    else return null;
    var wrap=el("div","menu-wrap");var btn=el("button","hmenu-btn");btn.innerHTML=DOTS;btn.title="Room options";btn.setAttribute("aria-label","Room options");
    var menu=el("div","menu");
    items.forEach(function(it){
      if(it[0]==="sep"){menu.appendChild(el("div","sep"));return;}
      if(it[0]==="header"){menu.appendChild(el("div","mlabel",it[1]));return;}
      if(it[0]==="layout"){var s=it[1],row=el("button","mlayout"),nm=el("span",null,s.name),dl=el("span","mdel","✕");
        row.appendChild(nm);row.appendChild(dl);row.title="Restore “"+s.name+"”";
        row.onclick=function(e){e.stopPropagation();closeMenus();restoreLayout(r,s)};
        dl.title="Delete";dl.onclick=function(e){e.stopPropagation();deleteLayout(r,s)};menu.appendChild(row);return;}
      var b=el("button",it[1]?"danger":"");b.textContent=it[0];b.onclick=function(e){e.stopPropagation();closeMenus();it[2]()};menu.appendChild(b)});
    btn.onclick=function(e){e.stopPropagation();var was=menu.classList.contains("open");closeMenus();if(!was)menu.classList.add("open")};
    wrap.appendChild(btn);wrap.appendChild(menu);return wrap;}
  function render(){buildRooms();var r=rooms[current];r.type==="ht"?renderHT(r):r.type==="solo"?renderSolo(r):renderPair(r)}
  var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="21.5" y2="12"/><line x1="5.3" y1="5.3" x2="6.7" y2="6.7"/><line x1="17.3" y1="17.3" x2="18.7" y2="18.7"/><line x1="5.3" y1="18.7" x2="6.7" y2="17.3"/><line x1="17.3" y1="6.7" x2="18.7" y2="5.3"/></svg>';
  var MOON='<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M21 12.9A8.5 8.5 0 1 1 11.1 3a6.7 6.7 0 0 0 9.9 9.9z"/></svg>';
  function curTheme(){return document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}
  function setThemeBtn(){var t=curTheme();$("#themeBtn").innerHTML=(t==="dark"?MOON+"<span>Dark</span>":SUN+"<span>Light</span>")}
  $("#themeBtn").onclick=function(){document.documentElement.setAttribute("data-theme",curTheme()==="dark"?"light":"dark");setThemeBtn()};
  setThemeBtn();
  $("#helpBtn").onclick=overviewModal;
  render();
  overviewModal();
})();
</script>
